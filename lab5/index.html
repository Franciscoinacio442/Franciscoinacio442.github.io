<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 5 — JavaScript</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Lab 5 — JavaScript</h1>
      <a href="../index.html">Voltar ao portefólio</a>
    </header>

    <main>
      <p id="mensagem">1. Passa por aqui!</p>

      <p>
        <span id="texto-colorido">2. Setúbal: entre a serra e o mar.</span>
        <br />
        <button type="button" class="color" data-color="purple">Roxo</button>
        <button type="button" class="color" data-color="darkorange">
          Laranja
        </button>
        <button type="button" class="color" data-color="teal">
          Verde-azulado
        </button>
      </p>

      <p>
        <label for="escrita">3. Experimenta escrever...</label>
        <input id="escrita" type="text" />
      </p>

      <p>
        <label for="cor-fundo">4. Escolhe uma cor de fundo:</label>
        <select id="cor-fundo">
          <option value="lavender">Lilás</option>
          <option value="white">Branco</option>
          <option value="lightpink">Rosa</option>
          <option value="lightblue">Azul-claro</option>
        </select>
      </p>

      <p>
        5.
       <p>
  5. Contador:
  <button id="botao-contar" type="button">Incrementar</button>
  <button id="botao-decrementar" type="button">Decrementar</button>
  <button id="botao-reset" type="button">Reset</button>
  <span id="contador" role="status">0</span>
</p>
        <p>6. Apresenta-te!</p>

        <p>
          <label for="nome">Nome:</label>
          <input
            id="nome"
            name="nome"
            type="text"
            placeholder="Insere o teu nome"
            autocomplete="given-name"
            required
          />
        </p>

        <p>
          <label for="idade">Idade:</label>
          <input
            id="idade"
            name="idade"
            type="number"
            placeholder="Insere a tua idade"
            min="0"
            max="120"
            step="1"
            required
          />
        </p>

        <button type="submit">Submeter</button>
        <p id="resposta" role="status"></p>
      </form>

      <p>
        7. Contador automático:
        <span id="contador-automatico">0</span>
      </p>
      <section aria-labelledby="titulo-flex">
        <h2 id="titulo-flex">8. Experimenta o Flexbox</h2>

        <p>
          <label for="direcao-flex">Escolhe a direção:</label>
          <select id="direcao-flex">
            <option value="row">Linha</option>
            <option value="row-reverse">Linha invertida</option>
            <option value="column">Coluna</option>
            <option value="column-reverse">Coluna invertida</option>
          </select>
        </p>

        <div id="container-bolas">
          <span class="bola">1</span>
          <span class="bola">2</span>
          <span class="bola">3</span>
          <span class="bola">4</span>
        </div>
      </section>
    </main>

    <footer>
      <p>DIW 2026 — Francisco Inácio</p>
    </footer>

    <script src="scripts/main.js"></script>
  </body>
</html>
