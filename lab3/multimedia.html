<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setúbal - Multimédia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Setúbal</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="local.html">Localização</a>
        <a href="multimedia.html">Multimédia</a>
        <a href="info.html">Informação</a>
      </nav>
    </header>
    <main class="main-multimedia">
      <section class="video-section">
        <video muted loop playsinline class="video-bg">
          <source
            src="https://cdn.pixabay.com/video/2020/05/25/40131-424823297_large.mp4"
            type="video/mp4"
          />
        </video>
        <div class="video-content">
          <h2>Oceano Profundo</h2>
          <p>A imensidão do mar</p>
        </div>
      </section>
      <section class="fotografias-sec">
        <h3 class="fotografias-h3">Galeria de Fotografias</h3>
        <div class="galeria-flex">
          <img
            src="https://images.unsplash.com/photo-1498623116890-37e912163d5d?auto=format&fit=crop&w=600&q=80"
            alt="Foto 1"
            class="img-transicao"
          />
          <img
            src="https://images.unsplash.com/photo-1505118380757-91f5f5632de0?auto=format&fit=crop&w=600&q=80"
            alt="Foto 2"
            class="img-transicao"
          />
          <img
            src="https://images.unsplash.com/photo-1471922694854-ff1b63b20054?auto=format&fit=crop&w=600&q=80"
            alt="Foto 3"
            class="img-transicao"
          />
        </div>
      </section>
      <section class="video-sec">
        <h3 class="video-h3">Vídeo Aéreo</h3>
        <iframe
          class="iframe-video"
          src="https://www.youtube.com/embed/ED9P64jN844"
          title="Vídeo de Setúbal"
          allowfullscreen
        ></iframe>
      </section>
    </main>
    <footer>
      <p>DIW 2026</p>
    </footer>
  </body>
</html>
